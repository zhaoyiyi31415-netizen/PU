<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的第一个网页</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Codex + GitHub + Vercel 工作流</p>
        <h1>你好，这是我的第一个网页。</h1>
        <p class="intro">
          这个页面由 Codex 创建，代码保存到 GitHub，并可以通过 Vercel 发布到互联网。
        </p>
        <div class="actions">
          <a class="button primary" href="https://github.com/zhaoyiyi31415-netizen" target="_blank" rel="noreferrer">查看 GitHub</a>
          <a class="button secondary" href="#workflow">了解流程</a>
        </div>
      </section>

      <section id="workflow" class="workflow" aria-label="工作流">
        <article>
          <span>1</span>
          <h2>说出想法</h2>
          <p>你用中文告诉 Codex 想做什么。</p>
        </article>
        <article>
          <span>2</span>
          <h2>保存代码</h2>
          <p>Codex 修改项目并提交到 GitHub。</p>
        </article>
        <article>
          <span>3</span>
          <h2>自动上线</h2>
          <p>Vercel 读取 GitHub 代码并生成网站。</p>
        </article>
      </section>
    </main>
  </body>
</html>
